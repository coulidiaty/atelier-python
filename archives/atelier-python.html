<title>Atelier Python</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout : sommaire du parcours à gauche, discussion avec Pyo au centre (une colonne de bulles).
   Sur téléphone, le sommaire devient un tiroir. */
:root{
  --bg:#ECF3F0; --surface:#FFFFFF; --surface-2:#DCE9E4; --fg:#1A2926; --muted:#566A65; --line:#CDDDD7;
  --accent:#2A8770; --accent-fg:#FFFFFF; --accent-2:#E8922F; --ok:#1E8757; --ko:#C2453B;
  --code-bg:#172523; --code-fg:#E4ECF5; --code-muted:#8AA09A; --code-line:rgb(255 255 255 / .09);
  --code-err-bg:rgb(255 96 96 / .13); --code-err-fg:#FFD7D3; --scrim:rgb(10 20 18 / .45);
  --f-body:"Nunito", "Segoe UI", system-ui, sans-serif; --f-code:"JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --r:16px; --r-lg:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1816; --surface:#16221F; --surface-2:#1F2F2B; --fg:#E2EEEA; --muted:#93A8A2; --line:#283A35;
    --accent:#54C2A3; --accent-fg:#06140F; --accent-2:#F4B55E; --ok:#5BCB93; --ko:#F07B70;
    --code-bg:#0A1210; --scrim:rgb(0 0 0 / .6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1816; --surface:#16221F; --surface-2:#1F2F2B; --fg:#E2EEEA; --muted:#93A8A2; --line:#283A35;
  --accent:#54C2A3; --accent-fg:#06140F; --accent-2:#F4B55E; --ok:#5BCB93; --ko:#F07B70;
  --code-bg:#0A1210; --scrim:rgb(0 0 0 / .6); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:17px/1.6 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
code{font-family:var(--f-code);font-size:.86em;background:var(--surface-2);padding:1px 6px;border-radius:5px}
button,input{font-family:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Barre du haut ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.12rem;white-space:nowrap;text-decoration:none;border:0;background:none;color:var(--fg);cursor:pointer;padding:0}
.logo{width:32px;height:32px;flex:none}
.logo .lg-bg{fill:var(--accent)}
.logo .lg-fg{fill:none;stroke:var(--accent-fg);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.where{flex:1;min-width:0;color:var(--muted);font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:flex;flex-direction:column;gap:4px;min-width:120px}
.prog span{font-size:.75rem;font-weight:800;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .5s ease}
.menu-btn{display:none;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:8px 12px;font-weight:800;font-size:.9rem;cursor:pointer}
.menu-btn svg{width:16px;height:16px}
.menu-btn svg path{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}

/* ---------- Structure ---------- */
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:270px minmax(0,1fr);gap:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);align-self:start;max-height:calc(100vh - 58px - env(safe-area-inset-top,0px));overflow-y:auto;padding-block:24px 32px;min-width:0}
.view{min-width:0;max-width:760px;padding-block:28px 110px;display:flex;flex-direction:column;gap:18px}
.scrim{display:none}

/* Sommaire */
.nav-top{display:grid;gap:2px;margin-bottom:18px}
.nav-link{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;font-weight:800;text-decoration:none;color:var(--fg);border:0;background:none;cursor:pointer;font-size:.95rem;text-align:left;width:100%}
.nav-link:hover{background:var(--surface-2)}
.nav-link.on{background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / .08)}
.nav-link svg{width:18px;height:18px;flex:none}
.nav-link svg path{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.side-label{margin:0 0 8px 10px;font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.11em;color:var(--muted)}
.chap{margin-bottom:4px}
.chap summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:8px;padding:8px 10px;border-radius:12px;font-weight:900;font-size:.95rem}
.chap summary::-webkit-details-marker{display:none}
.chap summary:hover{background:var(--surface-2)}
.chap summary .cn{color:var(--accent);font-variant-numeric:tabular-nums}
.chap summary small{margin-left:auto;font-size:.72rem;font-weight:800;color:var(--muted);white-space:nowrap}
.chap.planned summary{color:var(--muted)}
.chap.planned summary .cn{color:var(--muted)}
.lessons{list-style:none;margin:2px 0 8px;padding:0 0 0 8px;display:grid;gap:1px}
.les{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:10px;font-size:.88rem;line-height:1.3;text-decoration:none;color:var(--fg);border:0;background:none;width:100%;text-align:left;cursor:pointer}
button.les:hover{background:var(--surface-2)}
.les .ico{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:.66rem;font-weight:900;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
.les .ico svg{width:11px;height:11px}
.les .ico svg path{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.les .ico svg rect{fill:currentColor}
.les.done .ico{background:var(--ok);color:#FFFFFF}
.les.current{background:var(--surface);font-weight:800;box-shadow:0 1px 3px rgb(0 0 0 / .08)}
.les.current .ico{background:var(--accent);color:var(--accent-fg)}
.les.locked,.les.planned{color:var(--muted);cursor:default}
.les.planned .ico{background:transparent;border:1.5px dashed var(--line)}
.unlock{display:flex;align-items:flex-start;gap:8px;margin:18px 10px 0;font-size:.8rem;color:var(--muted);cursor:pointer}
.unlock input{margin-top:3px;accent-color:var(--accent)}

/* ---------- Bulles ---------- */
.step{display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:12px;row-gap:10px}
.who{padding-top:2px}
.pyo{width:40px;height:40px;display:block}
.pyo .p-skin{fill:var(--accent)}
.pyo .p-eye{fill:#FFFFFF}
.pyo .p-pupil{fill:#12201C}
.pyo .p-mouth{fill:none;stroke:#FFFFFF;stroke-width:2;stroke-linecap:round}
.pyo .p-tongue{fill:none;stroke:var(--ko);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bubble{min-width:0;background:var(--surface);border-radius:6px var(--r-lg) var(--r-lg) var(--r-lg);padding:20px 24px;box-shadow:0 1px 2px rgb(0 0 0 / .06),0 6px 20px rgb(0 0 0 / .05)}
.bubble h1{margin:2px 0 8px;font-size:clamp(1.6rem,4vw,2.1rem);line-height:1.15;font-weight:900;text-wrap:balance;letter-spacing:-.01em}
.bubble h2{margin:0 0 8px;font-size:1.14rem;line-height:1.3;font-weight:900;text-wrap:balance}
.bubble p{margin:0 0 10px;max-width:65ch}
.bubble p:last-child{margin-bottom:0}
.kicker{font-size:.76rem!important;font-weight:900;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);margin-bottom:4px!important}
.kind{display:inline-block;margin:0 0 8px!important;font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.kind.k-quiz{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.kind.k-rev{background:color-mix(in srgb,var(--accent-2) 20%,transparent);color:color-mix(in srgb,var(--accent-2) 70%,var(--fg))}
.kind.k-code,.kind.k-defi{background:var(--accent);color:var(--accent-fg)}
.kind.k-bug{background:var(--ko);color:#FFFFFF}
.kind.k-recap{background:var(--accent-2);color:#1C1404}
.body ul{margin:0 0 10px;padding-left:20px;display:grid;gap:5px}
.small{font-size:.86rem;color:var(--muted)}
.reply{grid-column:2;display:flex;justify-content:flex-end}
.reply p{margin:0;background:var(--accent);color:var(--accent-fg);padding:9px 16px;border-radius:var(--r-lg) 6px var(--r-lg) var(--r-lg);font-weight:700;max-width:85%}

/* Code */
.snippet{margin:12px 0;background:var(--code-bg);color:var(--code-fg);font:15px/1.6 var(--f-code);padding:14px 16px;border-radius:12px;overflow-x:auto}
.ide{margin-top:14px;border-radius:14px;overflow:hidden;background:var(--code-bg)}
.ide:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.ide-bar{display:flex;align-items:center;gap:12px;padding:7px 8px 7px 14px;border-bottom:1px solid var(--code-line)}
.file{display:flex;align-items:center;gap:8px;font:13px var(--f-code);color:var(--code-muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file i{width:8px;height:8px;border-radius:50%;background:var(--accent-2);flex:none}
.kbd{margin-left:auto;font:12px var(--f-code);color:var(--code-muted);white-space:nowrap}
.run{border:0;border-radius:10px;background:var(--accent);color:var(--accent-fg);font:800 .86rem/1 var(--f-body);padding:9px 14px;cursor:pointer;white-space:nowrap}
.run:disabled{opacity:.65;cursor:wait}
textarea.code{display:block;width:100%;border:0;resize:vertical;background:transparent;color:var(--code-fg);font:15px/1.6 var(--f-code);padding:14px 16px;tab-size:4;outline:none;white-space:pre;overflow-x:auto;caret-color:var(--accent-2)}
.console{border-top:1px solid var(--code-line);padding:10px 16px 14px}
.c-label{font:800 .66rem/1 var(--f-body);text-transform:uppercase;letter-spacing:.12em;color:var(--code-muted)}
.out{margin:8px 0 0;font:14px/1.55 var(--f-code);color:var(--code-fg);white-space:pre-wrap;word-break:break-word;max-height:340px;overflow-y:auto}
.out.empty{color:var(--code-muted);font-style:italic}
.ask{display:flex;align-items:center;gap:10px;margin-top:6px}
.py-in{flex:1;min-width:0;background:rgb(255 255 255 / .07);border:1.5px solid var(--accent-2);border-radius:8px;color:var(--code-fg);font:14px var(--f-code);padding:7px 10px;outline:none}
.ask-hint{font:12px var(--f-code);color:var(--code-muted);white-space:nowrap}
.err-box{margin-top:10px;background:var(--code-err-bg);border:1px solid rgb(255 120 120 / .35);border-radius:10px;padding:10px 12px;color:var(--code-err-fg);font:15px/1.5 var(--f-body)}
.err-box b{display:block;color:#FFFFFF}
.err-box p{margin:4px 0 0}
.err-box code{background:rgb(255 255 255 / .1);color:#FFFFFF}
.err-raw{display:block;margin-top:8px;font:12px/1.4 var(--f-code);color:#F0A49D;word-break:break-word}
.memory{border-top:1px solid var(--code-line);padding:10px 16px 16px}
.boxes{display:flex;flex-wrap:wrap;gap:16px 12px;margin-top:18px}
.box{position:relative;min-width:96px;max-width:100%;border:2px solid var(--accent-2);border-radius:8px;padding:14px 12px 8px;color:var(--code-fg);font:15px var(--f-code);word-break:break-word}
.box .tag{position:absolute;top:-11px;left:8px;background:var(--accent-2);color:#1C1404;font:700 .74rem/1 var(--f-code);padding:4px 8px;border-radius:5px}
.box .type{display:block;margin-top:4px;font:.72rem/1.3 var(--f-body);color:var(--code-muted)}
.mem-empty{margin:8px 0 0!important;font-size:.85rem;color:var(--code-muted);font-style:italic}

/* Quiz, retours, boutons */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:14px;padding:12px 14px;font:600 .98rem/1.35 var(--f-code);cursor:pointer;word-break:break-word}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.wrong{border-color:var(--ko);color:var(--ko);text-decoration:line-through}
.opt.right{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px;font-size:.98rem}
.fb.ok{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.fb.ko{background:color-mix(in srgb,var(--ko) 12%,transparent)}
.fb b{margin-right:5px}
.fb.ok b{color:var(--ok)}
.hint{margin-top:10px;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--accent-2) 20%,transparent);font-size:.96rem}
.hint b{margin-right:5px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.btn{border:0;border-radius:14px;padding:11px 18px;font:800 .96rem/1.2 var(--f-body);cursor:pointer;background:var(--accent);color:var(--accent-fg);text-align:left}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.wait{font-size:.9rem;color:var(--muted)}

/* Accueil et fiches */
.how{list-style:none;margin:14px 0 4px;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px}
.how li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;font-size:.96rem;line-height:1.45}
.how li b{display:block}
.how .hi{width:30px;height:30px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center}
.how .hi svg{width:17px;height:17px}
.how .hi svg path{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.parcours{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px}
.parcours li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.parcours li:first-child{border-top:0}
.parcours .pn{width:34px;height:34px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums}
.parcours .pt b{display:block;line-height:1.3}
.parcours .pt span{font-size:.84rem;color:var(--muted)}
.parcours .ps{font-size:.8rem;font-weight:800;color:var(--muted);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.parcours .ps .bar{width:80px;margin-top:5px}
.parcours li.planned .pn{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.fiche{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.fiche:first-of-type{border-top:0;margin-top:6px;padding-top:0}
.fiche h3{margin:0 0 6px;font-size:1rem;font-weight:900}
.fiche h3 span{color:var(--accent);margin-right:6px;font-variant-numeric:tabular-nums}
.fiche ul{margin:0;padding-left:20px;display:grid;gap:4px;font-size:.96rem}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:800;font-size:.92rem;max-width:calc(100% - 32px);z-index:40;box-shadow:0 6px 24px rgb(0 0 0 / .25)}

@media (max-width:999px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:inline-flex}
  .side{position:fixed;top:0;bottom:0;left:0;width:min(330px,88vw);max-height:none;z-index:35;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 18px) 14px calc(env(safe-area-inset-bottom,0px) + 24px) max(14px,env(safe-area-inset-left,0px));transform:translateX(-105%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s;box-shadow:8px 0 30px rgb(0 0 0 / .18)}
  .side.open{transform:none;visibility:visible;transition:transform .25s ease}
  .scrim.open{display:block;position:fixed;inset:0;background:var(--scrim);z-index:30}
  .view{margin:0 auto;width:100%}
}
@media (max-width:640px){
  body{font-size:16px}
  .where{display:none}
  .prog{margin-left:auto;min-width:90px}
  .step{grid-template-columns:32px minmax(0,1fr);column-gap:8px}
  .pyo{width:32px;height:32px}
  .bubble{padding:16px 16px}
  .kbd{display:none}
  .file{margin-right:auto}
  .how{grid-template-columns:minmax(0,1fr)}
  .opts{grid-template-columns:minmax(0,1fr)}
  .reply p{max-width:100%}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important;scroll-behavior:auto!important} }
</style>

<header class="top">
  <div class="top-in">
    <button type="button" class="menu-btn" id="menu" aria-expanded="false" aria-controls="side"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/></svg>Sommaire</button>
    <button type="button" class="brand" data-go="accueil"><svg class="logo" viewBox="0 0 30 30" aria-hidden="true"><rect class="lg-bg" width="30" height="30" rx="9"/><path class="lg-fg" d="M9 10l5 5-5 5"/><path class="lg-fg" d="M16 20h6"/></svg><span>Atelier Python</span></button>
    <div class="where" id="where"></div>
    <div class="prog" id="prog"></div>
  </div>
</header>
<div class="scrim" id="scrim"></div>
<div class="shell">
  <aside class="side" id="side" aria-label="Sommaire"></aside>
  <main class="view" id="view"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
<script>
/* ================= Contenu ================= */
const ERR = 'Ton code a une erreur. Lis l’explication dans la console, juste au-dessus.';
const strip = c => c.replace(/#.*$/gm, '');
const memOf = (r, n) => ((r && r.mem) || []).find(m => m.name === n);
const strOf = m => m && m.type === 'str' ? m.repr.slice(1, -1) : null;
const linesOf = o => (o || '').split('\n').map(s => s.trim()).filter(Boolean);
const nInputs = c => (strip(c).match(/input\s*\(/g) || []).length;
const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[ \t]+/g, ' ').toLowerCase();

const CHAPTERS = [
  { n:1, title:'Premiers pas', lessons:['1-1','1-2','1-3','1-4','1-5','1-6','1-7'] },
  { n:2, title:'Prendre des décisions', plan:['Comparer des valeurs','if et else','elif : plusieurs cas','and, or, not','Les pièges des conditions','Projet : le calculateur de mention'] },
  { n:3, title:'Répéter avec les boucles', plan:['La boucle while','La boucle for et range()','Parcourir un texte','break et continue','Compteurs et accumulateurs','Boucles imbriquées','Projet : le jeu du nombre mystère'] },
  { n:4, title:'Les fonctions', plan:['Créer une fonction avec def','Paramètres et arguments','return : renvoyer un résultat','Valeurs par défaut','Variables locales et globales','Importer des modules : math et random','Projet : ta boîte à outils'] },
  { n:5, title:'Ranger des données', plan:['Les listes','Modifier une liste','Parcourir et découper une liste','Les méthodes du texte','Tuples et ensembles','Les dictionnaires','Listes de dictionnaires','Projet : le gestionnaire de dépenses'] },
  { n:6, title:'Coder comme un pro', plan:['Installer Python et VS Code','Ton premier projet dans VS Code','Lire un message d’erreur en entier','try et except','Lire et écrire un fichier','Déboguer pas à pas'] },
  { n:7, title:'Projet final des bases', plan:['Concevoir son programme','Le jeu d’aventure en mode texte','Améliorer et partager son projet'] }
];

const LES = {};
LES['1-1'] = { title:'Afficher avec print()', dur:'8 min',
  intro:'Dans cette leçon, tu fais parler Python : afficher du texte, des nombres et des calculs. C’est la base de tout. Un programme qui n’affiche rien, on ne sait pas ce qu’il fait.',
  steps:[
    { t:'say', h:'Ta première instruction', file:'bonjour.py',
      p:`<p><code>print()</code> affiche à l'écran ce que tu mets entre ses parenthèses. Le texte se met <strong>entre guillemets</strong> : doubles <code>"…"</code> ou simples <code>'…'</code>, les deux marchent.</p><p>Clique sur <strong>Exécuter</strong> et regarde la console. Ensuite, change le texte et exécute encore.</p>`,
      code:`print("Salut !")
print('Je parle Python.')` },
    { t:'quiz', h:'Devine avant d’exécuter', p:`<p>Qu'affiche ce code ?</p>`, snip:`print(2 + 3)`,
      opts:[ {l:'2 + 3', why:'Ça, ce serait avec des guillemets : <code>print("2 + 3")</code>. Ici il n’y en a pas, donc Python calcule.'},
             {l:'5', ok:1},
             {l:'23', why:'23 arriverait avec du texte : <code>"2" + "3"</code>. Ici ce sont des nombres, donc Python additionne.'},
             {l:'Une erreur', why:'Pas d’erreur : Python sait très bien calculer.'} ],
      ex:'Sans guillemets, Python <strong>calcule</strong> d’abord, puis affiche le résultat. Avec des guillemets, il affiche le texte tel quel.' },
    { t:'say', h:'Plusieurs choses d’un coup', file:'plusieurs.py',
      p:`<p>Tu peux donner plusieurs valeurs à <code>print()</code>, séparées par des <strong>virgules</strong>. Python met un espace entre elles.</p><p>Et tout ce qui suit un <code>#</code> est un <strong>commentaire</strong> : Python l'ignore. C'est une note pour les humains qui liront ton code.</p>`,
      code:`# Ceci est un commentaire : Python ne le lit pas
print("J'ai", 19, "ans")
print("6 fois 7 =", 6 * 7)` },
    { t:'quiz', h:'Et là ?', p:`<p>Qu'affiche ce code ?</p>`, snip:`print("A", "B", "C")`,
      opts:[ {l:'ABC', why:'Les virgules ajoutent un espace entre chaque valeur.'},
             {l:'A B C', ok:1},
             {l:'A, B, C', why:'Les virgules servent à séparer les valeurs dans ton code. Elles ne s’affichent pas.'},
             {l:'Une erreur', why:'C’est tout à fait permis : <code>print()</code> accepte autant de valeurs que tu veux.'} ],
      ex:'Chaque virgule devient un espace à l’affichage.' },
    { t:'code', h:'À toi : dis bonjour', file:'exercice.py',
      p:`<p>Écris une ligne qui affiche <strong>Bonjour</strong> suivi de ton prénom.</p><p class="small">Dans les exercices, on tape soi-même : le copier-coller est désactivé. C'est en tapant que ça rentre.</p>`,
      code:`# Écris ta ligne en dessous
`,
      hints:['Il te faut <code>print()</code> et du texte entre guillemets.','La forme : <code>print("Bonjour ...")</code>, en remplaçant les points par ton prénom.'],
      check:r => r.err ? ERR : !r.out.trim() ? 'Rien ne s’affiche. As-tu bien utilisé <code>print()</code> ?' : !/bonjour/i.test(r.out) ? 'Ça s’affiche, mais je ne vois pas le mot « Bonjour ».' : r.out.trim().toLowerCase() === 'bonjour' ? 'Presque ! Ajoute ton prénom après Bonjour.' : true,
      ok:'Ta première ligne de code, écrite toute seule.' },
    { t:'code', h:'Deux lignes et un commentaire', file:'presentation.py',
      p:`<p>Affiche ton prénom sur une ligne, puis ta ville sur la ligne suivante. Ajoute un commentaire au-dessus pour expliquer ce que fait ton programme.</p>`,
      code:``,
      hints:['Chaque <code>print()</code> affiche une ligne. Il en faut donc deux.','Un commentaire ressemble à ça : <code># Mon programme se présente</code>'],
      check:(r, code) => r.err ? ERR : linesOf(r.out).length < 2 ? 'Il faut deux lignes affichées : un <code>print()</code> pour le prénom, un autre pour la ville.' : !/#/.test(code) ? 'Tes deux lignes s’affichent. Il manque juste le commentaire : une ligne qui commence par <code>#</code>.' : true,
      ok:'Programme clair et commenté. Les bons développeurs commentent leur code pour les autres, et pour eux-mêmes dans trois mois.' },
    { t:'code', bug:1, h:'Répare le bug', file:'bug.py',
      p:`<p>Ce code devrait afficher <code>Il fait beau</code>, mais il plante. Exécute-le, lis l'explication, puis répare-le.</p>`,
      code:`print("Il fait beau)`,
      hints:['Compte les guillemets : il en faut un au début et un à la fin du texte.','Il manque le <code>"</code> juste avant la parenthèse fermante.'],
      check:(r, code) => code.trim() === 'print("Il fait beau)' ? 'Voilà le bug ! Lis l’explication dans la console, puis corrige le code.' : r.err ? 'Le code plante encore. Lis l’explication dans la console.' : !/Il fait beau/.test(r.out) ? 'Plus d’erreur, mais il faut afficher <code>Il fait beau</code>.' : true,
      ok:'Tu viens de corriger ta première <code>SyntaxError</code>. Un guillemet oublié, c’est l’erreur numéro 1 des débutants.' }
  ],
  recap:['<code>print()</code> affiche du texte (entre guillemets) ou le résultat d’un calcul (sans guillemets).','Avec des virgules, <code>print()</code> affiche plusieurs valeurs séparées par un espace.','<code>#</code> crée un commentaire : une note que Python ignore.','Un guillemet oublié donne une <code>SyntaxError</code> : Python n’arrive plus à lire le code.'] };

LES['1-2'] = { title:'Les variables', dur:'10 min',
  intro:'Un programme a besoin de se souvenir de choses : un prénom, un score, un prix. Pour ça, on utilise des variables.',
  steps:[
    { t:'quiz', rev:1, h:'Une question sur la leçon d’avant', p:`<p>Qu'affiche ce code ?</p>`, snip:`# print("Coucou")
print("Salut")`,
      opts:[ {l:'Coucou puis Salut', why:'La première ligne commence par <code>#</code> : c’est un commentaire, Python l’ignore.'},
             {l:'Seulement Salut', ok:1},
             {l:'# Coucou puis Salut', why:'Le <code>#</code> ne s’affiche pas : il transforme toute la ligne en commentaire.'},
             {l:'Une erreur', why:'Un commentaire peut contenir n’importe quoi, même du code.'} ],
      ex:'Tout ce qui suit <code>#</code> est ignoré. Pratique pour « désactiver » une ligne sans l’effacer.' },
    { t:'say', h:'Des boîtes avec une étiquette', file:'boites.py', mem:1,
      p:`<p>Une <strong>variable</strong>, c'est une boîte avec une étiquette. On range une valeur dedans avec <code>=</code>, puis on la réutilise avec son nom, sans guillemets.</p><p>Exécute, puis regarde la <strong>Mémoire de Python</strong> sous la console : chaque boîte apparaît.</p>`,
      code:`prenom = "Léa"
age = 19
print(prenom)
print(age + 1)` },
    { t:'say', h:'Changer ce qu’il y a dans la boîte', file:'score.py', mem:1,
      p:`<p>Une variable peut changer de valeur : on range autre chose dans la boîte, et l'ancienne valeur est remplacée.</p><p>Attention, le <code>=</code> de Python ne veut pas dire « égal » comme en maths. Il veut dire : <strong>calcule ce qui est à droite, puis range-le dans la boîte de gauche</strong>. C'est pour ça que <code>score = score + 5</code> a du sens.</p>`,
      code:`score = 10
print(score)
score = 15
print(score)
score = score + 5
print(score)` },
    { t:'quiz', h:'Le piège de la copie', p:`<p>Qu'affiche ce code ?</p>`, snip:`a = 3
b = a
a = 10
print(b)`,
      opts:[ {l:'3', ok:1},
             {l:'10', why:'Au moment de <code>b = a</code>, Python range la valeur 3 dans b. Changer a ensuite ne touche pas b.'},
             {l:'13', why:'Il n’y a aucune addition ici : Python range juste des valeurs.'},
             {l:'Une erreur', why:'Tout est correct dans ce code.'} ],
      ex:'<code>b = a</code> copie la <strong>valeur</strong> de a dans b, à ce moment-là. Ensuite, les deux boîtes vivent leur vie.' },
    { t:'quiz', h:'Bien nommer ses boîtes',
      p:`<p>Un nom de variable contient des lettres, des chiffres et des <code>_</code>. Il ne commence pas par un chiffre et n'a pas d'espace. Les majuscules comptent : <code>age</code> et <code>Age</code> sont deux boîtes différentes. L'habitude en Python : des minuscules et des <code>_</code>, comme <code>nombre_de_vies</code>.</p><p>Lequel de ces noms est valide ?</p>`,
      opts:[ {l:'2joueurs', why:'Un nom ne peut pas commencer par un chiffre. <code>joueurs2</code> serait valide.'},
             {l:'nombre de vies', why:'Les espaces sont interdits : Python croirait voir trois mots.'},
             {l:'nombre_de_vies', ok:1},
             {l:'class', why:'<code>class</code> est un mot réservé de Python (tu le verras en POO). On ne peut pas l’utiliser comme nom.'} ],
      ex:'Valide et bien écrit : en minuscules, avec des <code>_</code>. On appelle ça le <em>snake_case</em>, l’écriture « serpent ». Ça me va bien.' },
    { t:'code', h:'À toi : calcule avec une variable', file:'double.py', mem:1,
      p:`<p>Crée une variable <code>score</code> qui vaut <code>10</code>. Puis affiche le double du score, <strong>sans écrire 20 toi-même</strong> : laisse Python calculer.</p>`,
      code:`# 1. Crée la boîte score

# 2. Affiche le double
`,
      hints:['<code>score = 10</code> crée la boîte.','Le double, c’est <code>score * 2</code>. Mets-le dans <code>print()</code>.'],
      check:(r, code) => {
        if (r.err) return ERR;
        const sc = memOf(r, 'score');
        if (!sc) return 'Je ne trouve pas de boîte <code>score</code> dans la mémoire. Commence par <code>score = 10</code>.';
        if (sc.repr !== '10') return `Ta boîte <code>score</code> contient ${esc(sc.repr)}. Il faut 10.`;
        if (/(^|[^\w.])20(?![\w.])/.test(strip(code))) return 'Tu as écrit 20 toi-même. Laisse Python calculer avec <code>score * 2</code>.';
        if (!/(^|\D)20(\D|$)/.test(r.out)) return 'La boîte est prête. Maintenant, affiche le double avec <code>print()</code>.';
        return true;
      },
      ok:'Python a fait le calcul à ta place. C’est tout l’intérêt des variables.' },
    { t:'code', defi:1, h:'Échange les boîtes', file:'echange.py', mem:1,
      p:`<p>Les boîtes <code>a</code> et <code>b</code> contiennent 1 et 2. Échange leur contenu pour que <code>a</code> vaille 2 et <code>b</code> vaille 1, <strong>sans réécrire les nombres 1 ou 2</strong>.</p>`,
      code:`a = 1
b = 2
# Échange les valeurs ici

print(a, b)`,
      hints:['Si tu fais <code>a = b</code> tout de suite, l’ancienne valeur de a est perdue. Mets-la d’abord à l’abri dans une troisième boîte.','<code>temp = a</code>, puis <code>a = b</code>, puis <code>b = temp</code>.'],
      check:(r, code) => {
        if (r.err) return ERR;
        const ma = memOf(r, 'a'), mb = memOf(r, 'b');
        if (!ma || !mb) return 'Les boîtes a et b ont disparu. Garde les deux premières lignes.';
        const rest = strip(code).replace(/^\s*a\s*=\s*1\s*$/m, '').replace(/^\s*b\s*=\s*2\s*$/m, '');
        if (/\b[12]\b/.test(rest)) return 'Pas le droit de réécrire 1 ou 2 : utilise les variables elles-mêmes.';
        if (ma.repr !== '2' || mb.repr !== '1') return `Pour l’instant, a vaut ${esc(ma.repr)} et b vaut ${esc(mb.repr)}. Il faut a = 2 et b = 1.`;
        return true;
      },
      ok:'Bien joué. Petit secret : en Python, on peut aussi écrire <code>a, b = b, a</code> en une seule ligne.' },
    { t:'code', bug:1, h:'Répare le bug', file:'bug.py',
      p:`<p>Ce programme devrait afficher <code>Salut Alex</code>, mais il plante. Exécute-le, lis l'explication de l'erreur, puis répare-le.</p>`,
      code:`nom = "Alex"
print("Salut " + Nom)`,
      hints:['Lis l’erreur : quel nom Python ne connaît pas ?','Pour Python, <code>Nom</code> et <code>nom</code> sont deux noms différents.'],
      check:(r, code) => code.trim() === 'nom = "Alex"\nprint("Salut " + Nom)' ? 'Voilà le bug ! Lis l’explication dans la console, puis corrige le code.' : r.err ? 'Le code plante encore. Lis l’explication dans la console.' : !/Salut Alex/.test(r.out) ? 'Plus d’erreur, mais il faut afficher exactement <code>Salut Alex</code>.' : true,
      ok:'C’était la majuscule. La <code>NameError</code> veut presque toujours dire : faute de frappe, ou variable pas encore créée.' }
  ],
  recap:['Une variable est une boîte avec une étiquette : <code>score = 10</code>.','Le <code>=</code> veut dire « range la valeur de droite dans la boîte de gauche ».','Une variable peut changer de valeur : la nouvelle remplace l’ancienne.','Noms en minuscules avec des <code>_</code>, sans espace, sans chiffre au début. <code>nom</code> et <code>Nom</code> sont différents.'] };

LES['1-3'] = { title:'Les types de valeurs', dur:'10 min',
  intro:'Pour Python, 19 et "19" ne sont pas du tout la même chose. Dans cette leçon, tu découvres les types : la nature de ce qu’il y a dans chaque boîte.',
  steps:[
    { t:'quiz', rev:1, h:'Une question sur la leçon d’avant', p:`<p>Qu'affiche ce code ?</p>`, snip:`x = 5
x = x + 1
print(x)`,
      opts:[ {l:'5', why:'La deuxième ligne range x + 1, donc 6, dans x.'},
             {l:'6', ok:1},
             {l:'x + 1', why:'Sans guillemets, Python calcule.'},
             {l:'Une erreur', why:'<code>x = x + 1</code> est parfaitement valide : calcule à droite, range à gauche.'} ],
      ex:'Python calcule <code>x + 1</code> avec l’ancienne valeur (5), puis range 6 dans x.' },
    { t:'say', h:'Les quatre types de base', file:'types.py',
      p:`<p>Chaque valeur a un <strong>type</strong> :</p><ul><li><code>int</code> : un nombre entier, comme <code>19</code> ou <code>-3</code></li><li><code>float</code> : un nombre à virgule, comme <code>3.5</code>. On écrit un <strong>point</strong>, pas une virgule.</li><li><code>str</code> : du texte entre guillemets, comme <code>"Bonjour"</code></li><li><code>bool</code> : vrai ou faux, <code>True</code> ou <code>False</code></li></ul><p>La fonction <code>type()</code> te dit le type d'une valeur.</p>`,
      code:`print(type(19))
print(type(3.5))
print(type("Bonjour"))
print(type(True))` },
    { t:'quiz', h:'Le piège des guillemets', p:`<p>Quel est le type de <code>"19"</code> ?</p>`,
      opts:[ {l:'int', why:'Il y a des guillemets : pour Python, c’est du texte, même si ça ressemble à un nombre.'},
             {l:'float', why:'Pas de point, et surtout il y a des guillemets.'},
             {l:'str', ok:1},
             {l:'bool', why:'Un bool vaut seulement True ou False.'} ],
      ex:'<code>"19"</code> est du texte. Python ne peut pas faire de calcul avec tant qu’on ne l’a pas converti. Tu verras comment dans la leçon 1.6.' },
    { t:'say', h:'Pourquoi le type compte', file:'plus.py',
      p:`<p>Le même signe <code>+</code> ne fait pas la même chose selon le type. Avec des nombres, il additionne. Avec du texte, il <strong>colle</strong> les morceaux. Et <code>*</code> sur du texte le répète.</p>`,
      code:`print(5 + 5)
print("5" + "5")
print("5" * 3)` },
    { t:'quiz', h:'La division', p:`<p>Qu'affiche ce code ?</p>`, snip:`print(7 / 2)`,
      opts:[ {l:'3', why:'La division <code>/</code> garde les décimales. Pour une division entière, tu verras <code>//</code> dans la leçon suivante.'},
             {l:'3.5', ok:1},
             {l:'4', why:'Python n’arrondit pas avec <code>/</code>.'},
             {l:'7/2', why:'Pas de guillemets, donc Python calcule.'} ],
      ex:'<code>/</code> donne toujours un float. Même <code>print(4 / 2)</code> affiche <code>2.0</code>, et pas 2.' },
    { t:'say', h:'Vrai ou faux', file:'booleens.py', mem:1,
      p:`<p>Le type <code>bool</code> n'a que deux valeurs : <code>True</code> et <code>False</code>, avec une majuscule. On les obtient souvent en <strong>comparant</strong> : <code>10 &gt; 3</code> vaut <code>True</code>.</p><p>Pour tester l'égalité, on écrit <code>==</code>, deux signes égal. Un seul <code>=</code> sert à ranger dans une boîte. C'est la base des conditions du chapitre 2.</p>`,
      code:`est_majeur = True
print(est_majeur)
print(10 > 3)
print(2 == 5)` },
    { t:'code', h:'À toi : une boîte de chaque type', file:'mes_types.py', mem:1,
      p:`<p>Crée quatre variables, une de chaque type : <code>age</code> (int), <code>taille</code> (float, en mètres), <code>ville</code> (str) et <code>etudiant</code> (bool). Puis affiche le type de <code>taille</code>.</p>`,
      code:`# Tes quatre variables

# Le type de taille
`,
      hints:['Exemple pour la première : <code>age = 19</code>.','<code>taille = 1.75</code>, <code>ville = "Lyon"</code>, <code>etudiant = True</code>, puis <code>print(type(taille))</code>.'],
      check:r => {
        if (r.err) return ERR;
        const want = [['age','int',''],['taille','float',' Écris un nombre à virgule avec un point, comme <code>1.75</code>.'],['ville','str',' Mets le texte entre guillemets.'],['etudiant','bool',' Écris <code>True</code> ou <code>False</code>, sans guillemets et avec une majuscule.']];
        for (const [n, t, tip] of want) {
          const m = memOf(r, n);
          if (!m) return `Il manque la boîte <code>${n}</code>.`;
          if (m.type !== t) return `<code>${n}</code> est de type ${esc(m.type)}, il faut ${t}.${tip}`;
        }
        if (!/float/.test(r.out)) return 'Tes boîtes sont parfaites. Affiche maintenant <code>type(taille)</code> avec <code>print()</code>.';
        return true;
      },
      ok:'Quatre boîtes, quatre types. Regarde la mémoire : chaque boîte affiche son type.' },
    { t:'code', bug:1, h:'Répare le bug', file:'bug.py',
      p:`<p>Ce code devrait afficher <code>J'ai 19 ans</code>. Il plante : lis l'explication, puis répare-le.</p>`,
      code:`age = 19
print("J'ai " + age + " ans")`,
      hints:['On ne peut pas coller du texte et un nombre avec <code>+</code>. Il faut transformer le nombre en texte.','<code>str(age)</code> transforme 19 en "19". Autre solution : les virgules, <code>print("J\'ai", age, "ans")</code>.'],
      check:(r, code) => code.trim() === 'age = 19\nprint("J\'ai " + age + " ans")' ? 'Voilà le bug ! Lis l’explication dans la console, puis corrige le code.' : r.err ? 'Le code plante encore. Lis l’explication dans la console.' : !/J'ai 19 ans/.test(r.out) ? 'Plus d’erreur, mais il faut afficher exactement <code>J\'ai 19 ans</code>.' : true,
      ok:'Tu as rencontré la <code>TypeError</code>, une des erreurs les plus fréquentes. Tu sais maintenant la reconnaître.' }
  ],
  recap:['4 types de base : <code>int</code> (entier), <code>float</code> (à virgule, avec un point), <code>str</code> (texte), <code>bool</code> (<code>True</code> ou <code>False</code>).','<code>type(x)</code> donne le type de x.','<code>"19"</code> est du texte, pas un nombre.','<code>+</code> additionne les nombres mais colle le texte. Mélanger les deux donne une <code>TypeError</code>.','<code>==</code> compare, <code>=</code> range.'] };

LES['1-4'] = { title:'Calculer', dur:'12 min',
  intro:'Python est une super calculatrice. Dans cette leçon : les opérations, les priorités, et deux opérateurs très utiles que peu de gens connaissent.',
  steps:[
    { t:'quiz', rev:1, h:'Une question sur la leçon d’avant', p:`<p>Quel est le type de <code>3.0</code> ?</p>`,
      opts:[ {l:'int', why:'Il y a un point : c’est un float, même si la partie après la virgule vaut 0.'},
             {l:'float', ok:1},
             {l:'str', why:'Pas de guillemets, ce n’est pas du texte.'},
             {l:'bool', why:'Un bool vaut seulement True ou False.'} ],
      ex:'Le point décide de tout : <code>3</code> est un int, <code>3.0</code> est un float.' },
    { t:'say', h:'Les sept opérations', file:'operations.py',
      p:`<p>En plus de <code>+</code>, <code>-</code>, <code>*</code> (multiplier) et <code>/</code> (diviser), Python a trois opérations spéciales :</p><ul><li><code>//</code> : la division <strong>entière</strong>, sans les décimales. 17 // 5 donne 3.</li><li><code>%</code> : le <strong>reste</strong> de la division. 17 % 5 donne 2, car 17 = 3 × 5 + 2.</li><li><code>**</code> : la <strong>puissance</strong>. 2 ** 10 donne 1024.</li></ul>`,
      code:`print(17 + 5)
print(17 - 5)
print(17 * 5)
print(17 / 5)
print(17 // 5)
print(17 % 5)
print(2 ** 10)` },
    { t:'quiz', h:'Le reste', p:`<p>Qu'affiche ce code ?</p>`, snip:`print(20 % 6)`,
      opts:[ {l:'3', why:'Ça, c’est <code>20 // 6</code> : combien de fois 6 rentre dans 20.'},
             {l:'2', ok:1},
             {l:'3.33', why:'Ça ressemble à <code>20 / 6</code>. Le <code>%</code> donne le reste.'},
             {l:'0', why:'On aurait 0 si 6 rentrait pile dans 20.'} ],
      ex:'6 rentre 3 fois dans 20 (3 × 6 = 18), et il reste 2.' },
    { t:'say', h:'Qui passe en premier ?', file:'priorites.py',
      p:`<p>Comme en maths : <code>**</code> d'abord, puis <code>*</code> <code>/</code> <code>//</code> <code>%</code>, puis <code>+</code> et <code>-</code>. Les <strong>parenthèses</strong> passent avant tout.</p>`,
      code:`print(2 + 3 * 4)
print((2 + 3) * 4)` },
    { t:'quiz', h:'À toi de calculer', p:`<p>Qu'affiche ce code ?</p>`, snip:`print(10 - 2 * 3)`,
      opts:[ {l:'24', why:'Ce serait vrai avec des parenthèses : <code>(10 - 2) * 3</code>. Mais la multiplication passe avant.'},
             {l:'4', ok:1},
             {l:'8', why:'Il faut d’abord faire 2 * 3 = 6, puis 10 - 6.'},
             {l:'Une erreur', why:'Aucune erreur, c’est un calcul normal.'} ],
      ex:'D’abord <code>2 * 3 = 6</code>, puis <code>10 - 6 = 4</code>.' },
    { t:'say', h:'Les raccourcis', file:'raccourcis.py', mem:1,
      p:`<p>Augmenter une variable revient très souvent. Au lieu de <code>points = points + 50</code>, on écrit <code>points += 50</code>. Pareil avec <code>-=</code>, <code>*=</code> et <code>/=</code>.</p>`,
      code:`vies = 3
vies -= 1
print(vies)
points = 0
points += 50
points += 25
print(points)` },
    { t:'code', h:'À toi : la soirée pizza', file:'pizza.py', mem:1,
      p:`<p>Une pizza coûte 12.5 €. Vous êtes 4 amis et vous en prenez 3. Range ces nombres dans des variables, puis calcule et affiche le prix par personne. Ne fais pas le calcul de tête : c'est le travail de Python.</p>`,
      code:`prix_pizza = 12.5
`,

      check:(r, code) => r.err ? ERR : /9\.375/.test(strip(code)) ? 'Tu as écrit le résultat toi-même. Laisse Python le calculer avec tes variables.' : /9\.375/.test(r.out) ? true : !r.out.trim() ? 'Rien ne s’affiche. N’oublie pas le <code>print()</code>.' : 'Ce n’est pas encore le bon prix. Le total, c’est le prix fois le nombre de pizzas. Ensuite, on divise par le nombre d’amis.',
      ok:'Chacun paie 9.375 €. Pour arrondir, Python a <code>round(9.375, 2)</code>, qui donne 9.38. Tu le reverras plus tard.' },
    { t:'code', defi:1, h:'Les minutes', file:'minutes.py',
      p:`<p>Transforme <code>minutes</code> en heures et minutes avec <code>//</code> et <code>%</code>. Pour 135, ton programme doit afficher : <code>2 h 15 min</code>.</p><p>Attention : je testerai aussi ton code avec un autre nombre de minutes.</p>`,
      code:`minutes = 135
`,
      hints:['<code>heures = minutes // 60</code> : combien de fois 60 rentre dans minutes.','<code>reste = minutes % 60</code>, puis <code>print(heures, "h", reste, "min")</code>.'],

    { t:'quiz', h:'Pair ou impair ?', p:`<p>Quel calcul permet de savoir si un nombre <code>n</code> est pair ?</p>`,
      opts:[ {l:'n / 2', why:'Ça donne la moitié, mais 7 / 2 = 3.5 et 8 / 2 = 4.0 : pas très pratique à tester.'},
             {l:'n % 2', ok:1},
             {l:'n // 2', why:'Ça donne la moitié sans décimales, mais 7 // 2 et 6 // 2 donnent tous les deux 3.'},
             {l:'n ** 2', why:'Ça, c’est le carré de n.'} ],
      ex:'Si <code>n % 2</code> vaut 0, il ne reste rien quand on divise par 2 : n est pair. S’il vaut 1, n est impair. Tu t’en serviras souvent avec les conditions.' }

  recap:['<code>+ - * /</code> comme en maths. <code>/</code> donne toujours un float.','<code>//</code> : division entière. <code>%</code> : reste. <code>**</code> : puissance.','Priorités : parenthèses, puis <code>**</code>, puis <code>* / // %</code>, puis <code>+ -</code>.','<code>x += 5</code> est un raccourci pour <code>x = x + 5</code>.','<code>n % 2</code> vaut 0 quand n est pair.'] };

LES['1-5'] = { title:'Jouer avec le texte', dur:'12 min',

      code:`prenom = "Sam"

    { t:'say', h:'Chaque lettre a un numéro', file:'indices.py',
      p:`<p>Dans un texte, chaque caractère a une <strong>position</strong>, qu'on appelle un <em>indice</em>. Le piège : on commence à compter à <strong>0</strong>. <code>mot[0]</code> donne la première lettre, et <code>mot[-1]</code> la dernière.</p>`,
      code:`mot = "Python"

    { t:'say', h:'Transformer le texte', file:'methodes.py',
      p:`<p>Le texte a des <strong>méthodes</strong> : des actions qu'on écrit après un point. <code>upper()</code> met en majuscules, <code>lower()</code> en minuscules, <code>replace()</code> remplace un morceau par un autre.</p><p>Retiens cette forme : <code>texte.action()</code>. C'est exactement comme ça que marchent les objets en POO.</p><p>Regarde la dernière ligne : <code>phrase</code> n'a pas changé. Ces méthodes créent un nouveau texte sans toucher à l'original.</p>`,
      code:`phrase = "j'adore le Java"
print(phrase.upper())
print(phrase.replace("Java", "Python"))
print(phrase)` },
    { t:'code', h:'À toi : présente-toi', file:'presente.py', mem:1,
      p:`<p>Remplis les variables <code>prenom</code> et <code>ville</code>, puis affiche avec une f-string : <code>Je m'appelle Sam et j'habite à Paris.</code> (avec tes valeurs, et le point final).</p>`,
      code:`prenom = ""
ville = ""
`,
      hints:['Une f-string commence par un <code>f</code> collé aux guillemets : <code>f"Je m\'appelle {prenom} ..."</code>','<code>print(f"Je m\'appelle {prenom} et j\'habite à {ville}.")</code>'],

        if (r.err) return ERR;

      ok:'Propre et lisible. Dans la vraie vie, on utilise les f-strings presque tout le temps.' },
    { t:'code', defi:1, h:'Première lettre et longueur', file:'mot.py',
      p:`<p>La variable <code>mot</code> contient un mot. Affiche sa première lettre <strong>en majuscule</strong>, puis sa longueur, chacune sur sa ligne. Pour "python", ça donne <code>P</code> puis <code>6</code>.</p><p>Je testerai aussi ton code avec un autre mot.</p>`,

`,
      hints:['La première lettre : <code>mot[0]</code>. En majuscule : <code>mot[0].upper()</code>.','La longueur : <code>len(mot)</code>. Un <code>print()</code> pour chaque ligne.'],

        if (r.err) return ERR;

        if (t.err || tl[0] !== 'A' || tl[1] !== '7') return 'Ça marche pour ton mot, mais pas quand je teste avec "atelier" : il faudrait A puis 7. Utilise la variable <code>mot</code> au lieu d’écrire la réponse.';

  recap:['<code>+</code> colle, <code>*</code> répète, <code>len()</code> mesure (espaces compris).','f-string : <code>f"Salut {prenom}"</code>. On peut y mettre des calculs.','Les indices commencent à 0 : <code>mot[0]</code> est la première lettre, <code>mot[-1]</code> la dernière.','Méthodes du texte : <code>upper()</code>, <code>lower()</code>, <code>replace()</code>. Elles renvoient un nouveau texte.'] };

const TYPE = { str:'texte (str)', int:'nombre entier (int)', float:'nombre à virgule (float)', bool:'vrai ou faux (bool)', list:'liste (list)', dict:'dictionnaire (dict)', tuple:'tuple', set:'ensemble (set)', NoneType:'rien (None)' };
function readFile(x){
  if (Sk.builtinFiles === undefined || Sk.builtinFiles.files[x] === undefined) throw "Fichier introuvable : '" + x + "'";
  return Sk.builtinFiles.files[x];
}
function readMem(mod){
  const d = mod && mod.$d; if (!d) return [];
  const rows = [];
  for (const k of Object.keys(d)) {
    if (k.startsWith('__')) continue;
    const v = d[k]; if (!v || !v.tp$name) continue;
    if (['function','module','type','builtin_function_or_method','method'].includes(v.tp$name)) continue;
    let r; try { r = Sk.misceval.objectRepr(v); if (typeof r !== 'string') r = (r && r.v !== undefined) ? r.v : String(r); } catch(_) { r = '?'; }
    rows.push({ name:k.replace(/_\$rn\$$/, ''), type:v.tp$name, repr:r });
  }

}
function explain(e){
  const name = (e && e.tp$name) || (e && e.name) || 'Erreur';
  let raw = ''; try { raw = e.toString(); } catch(_) { raw = String(e); }
  let line = null;
  if (e && e.traceback && e.traceback.length) line = e.traceback[0].lineno;
  if (!line) { const m = raw.match(/on line (\d+)/); if (m) line = +m[1]; }
  const L = line ? ` (ligne ${line})` : '';
  let title, text;
  switch (name) {
    case 'NameError': { const m = raw.match(/name '([^']+)'/); title = `Python ne connaît pas « ${m ? m[1] : 'ce nom'} »${L}`; text = 'Vérifie l’orthographe : pour Python, <code>Nom</code> et <code>nom</code> sont deux noms différents. As-tu bien créé cette variable avant de l’utiliser ? Et si c’est du texte, il faut des guillemets.'; break; }
    case 'SyntaxError': case 'TokenError': title = `Python n’arrive pas à lire ton code${L}`; text = 'Souvent, c’est un guillemet ou une parenthèse oubliés. Chaque <code>(</code> a besoin de sa <code>)</code>, et chaque <code>"</code> de son partenaire.'; break;
    case 'IndentationError': case 'TabError': title = `Problème d’espaces en début de ligne${L}`; text = 'Pour l’instant, commence chaque ligne tout à gauche, sans espace devant.'; break;
    case 'TypeError': title = `Mélange impossible${L}`; text = 'Tu mélanges deux types qui ne vont pas ensemble, par exemple du texte et un nombre. Convertis avec <code>int()</code> ou <code>str()</code>, ou utilise une f-string.'; break;
    case 'ValueError': { const m = raw.match(/: '(.*)'/); title = `Python ne peut pas convertir ${m ? '« ' + m[1] + ' »' : 'cette valeur'} en nombre${L}`; text = '<code>int()</code> n’accepte que du texte qui ressemble à un nombre entier, comme "19". Pour un nombre à virgule, utilise <code>float()</code>.'; break; }
    case 'IndexError': title = `Cette position n’existe pas${L}`; text = 'Les indices commencent à 0 et s’arrêtent à la longueur moins 1. Dans "Sam", le dernier indice est 2.'; break;
    case 'AttributeError': title = `Cette méthode n’existe pas pour ce type${L}`; text = 'Vérifie l’orthographe de la méthode, et le type de la valeur avant le point.'; break;
    case 'ZeroDivisionError': title = `Division par zéro${L}`; text = 'Même Python ne sait pas diviser par 0.'; break;
    case 'TimeoutError': case 'TimeLimitError': title = 'Ton programme tourne trop longtemps'; text = 'Il ne s’arrête jamais : vérifie tes boucles.'; break;
    default: title = `Erreur Python : ${name}${L}`; text = 'Lis le message original ci-dessous : il indique souvent la ligne en cause.';
  }
  return { title, text, raw };
}
function runPy(code, o = {}){
  let out = '';
  const live = o.live;
  const queue = o.inputs ? [...o.inputs] : null;
  const show = () => { if (live) { live.textContent = out.length > 20000 ? '…' + out.slice(-20000) : out; live.classList.toggle('empty', !out); live.scrollTop = live.scrollHeight; } };
  Sk.configure({
    output: t => { out += t; show(); },
    read: readFile, __future__: Sk.python3, execLimit: 4000, yieldLimit: 100, inputfunTakesPrompt: true,
    inputfun: prompt => {
      out += prompt; show();
      if (queue) { const v = queue.length ? String(queue.shift()) : ''; out += v + '\n'; return v; }
      if (!o.ask) { out += '\n'; return ''; }
      return o.ask().then(v => { out += v + '\n'; show(); Sk.execStart = Date.now(); Sk.lastYield = Date.now(); return v; });
    }
  });
  Sk.execStart = Date.now(); Sk.lastYield = Date.now();
  return Sk.misceval.asyncToPromise(() => Sk.importMainWithBody('<stdin>', false, code, true))
    .then(m => ({ out, err:null, mem:readMem(m) }), e => ({ out, err:explain(e), mem:null }));
}

  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2800);
}
function askIn(con){
  return new Promise(res => {
    const w = document.createElement('div'); w.className = 'ask';
    w.innerHTML = '<input class="py-in" type="text" autocomplete="off" spellcheck="false" aria-label="Ta réponse au programme"><span class="ask-hint">Entrée ↵</span>';
    con.appendChild(w);
    const inp = w.querySelector('input'); inp.focus({ preventScroll:true });
    const done = v => { w.remove(); pendingAsk = null; res(v); };
    pendingAsk = () => done('');
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); done(inp.value); } });
  });
}
async function run(lid, i){
  if (busy) return; busy = true; const tok = ++runToken;
  const s = LES[lid].steps[i], st = stOf(lid)[i];
  const el = $('st-' + i);
  const btn = el && el.querySelector('.run'); if (btn) { btn.disabled = true; btn.textContent = 'En cours…'; }
  const con = el && el.querySelector('.console');
  if (con) con.querySelectorAll('.err-box').forEach(x => x.remove());
  const live = con && con.querySelector('.out');
  if (live) { live.textContent = ''; live.classList.remove('empty'); }
  const r = await runPy(st.code, { live, ask:() => askIn(con) });
  if (tok !== runToken || view.type !== 'lesson' || view.id !== lid) { busy = false; return; }
  st.out = r.out; st.err = r.err; st.mem = r.mem;
  if (s.t === 'say' && !st.done) st.done = true;
  if (s.t === 'code' && (!st.done || st.skipped)) {
    const unchanged = s.bug && st.code.trim() === s.code.trim();
    let v;
    try { v = await s.check(r, st.code, (inputs, c) => runPy(c === undefined ? st.code : c, { inputs })); }
    catch (e) { console.error(e); v = 'Je n’ai pas réussi à vérifier ton code. Réessaie.'; }
    if (!unchanged) st.tries++;
    if (v === true) { st.done = true; st.skipped = false; st.fb = { ok:true, text:s.ok || '' }; }
    else if (!st.skipped) st.fb = { ok:false, text:v };
    else st.fb = { ok:false, text:v + ' (Exercice passé : tu peux continuer quand même.)' };
  }
  busy = false; save(); updateStep(lid, i); renderTop();
  if (!st.done) { const ta = $('code-' + i); if (ta) ta.focus({ preventScroll:true }); }
}
function pick(lid, i, k){
  const s = LES[lid].steps[i], st = stOf(lid)[i], o = s.opts[k];
  if (st.done || st.picked.includes(k)) return;
  st.picked.push(k);
  st.fb = o.ok ? { ok:true, text:s.ex } : { ok:false, text:o.why };
  if (o.ok) st.done = true;
  save(); updateStep(lid, i);
}
function next(lid, i){
  const L = LES[lid], sts = stOf(lid);
  sts[i].done = true;
  S.cur[lid] = i + 1;
  const ns = L.steps[i + 1];
  if (ns && ns.carry && sts[i + 1].code === ns.code && !sts[i + 1].out) sts[i + 1].code = sts[i].code.trimEnd() + '\n\n' + ns.code;
  if (S.cur[lid] >= L.steps.length) S.done[lid] = true;
  save(); renderTop(); renderSide(); renderView();
  const el = $('st-' + (i + 1));
  if (el) {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    el.scrollIntoView({ behavior:reduce ? 'auto' : 'smooth', block:'start' });
    const ta = el.querySelector('textarea'); if (ta) setTimeout(() => ta.focus({ preventScroll:true }), 400);
  }
}
function openSide(on){
  $('side').classList.toggle('open', on); $('scrim').classList.toggle('open', on);
  $('menu').setAttribute('aria-expanded', String(on));
}
function go(token){
  if (pendingAsk) pendingAsk();
  runToken++;
  if (token === 'fiches') view = { type:'fiches' };
  else if (token === 'accueil') view = { type:'home' };
  else { const id = token.slice(1); if (!LES[id] || !available(id)) return; view = { type:'lesson', id }; }
  try { history.replaceState(null, '', '#' + token); } catch(_) {}
  openSide(false); renderAll(); window.scrollTo(0, 0);
}

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const b = e.target.closest('[data-act]'); if (!b || view.type !== 'lesson') return;
  const lid = view.id, i = +b.dataset.i;
  switch (b.dataset.act) {
    case 'run': run(lid, i); break;
    case 'opt': pick(lid, i, +b.dataset.k); break;
    case 'hint': stOf(lid)[i].hints++; save(); updateStep(lid, i); break;
    case 'skip': { const st = stOf(lid)[i]; st.done = true; st.skipped = true; st.fb = { ok:false, text:'Pas de souci : tu peux continuer, et revenir sur cet exercice quand tu veux. Il reste ouvert.' }; save(); updateStep(lid, i); break; }
    case 'next': next(lid, i); break;
  }
});
const V = $('view');
V.addEventListener('input', e => {
  const t = e.target; if (!t.matches('textarea.code') || view.type !== 'lesson') return;
  stOf(view.id)[+t.dataset.i].code = t.value;
  t.rows = Math.max(4, t.value.split('\n').length + 1);
  save();
});
V.addEventListener('keydown', e => {
  const t = e.target; if (!t.matches('textarea.code') || view.type !== 'lesson') return;
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(view.id, +t.dataset.i); }
  else if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); t.setRangeText('    ', t.selectionStart, t.selectionEnd, 'end'); t.dispatchEvent(new Event('input', { bubbles:true })); }
});
V.addEventListener('paste', e => {
  if (e.target.matches('textarea[data-nopaste]')) { e.preventDefault(); toast('Dans les exercices, on tape soi-même : c’est comme ça que ça rentre.'); }
});
V.addEventListener('drop', e => { if (e.target.matches('textarea[data-nopaste]')) e.preventDefault(); });
$('side').addEventListener('change', e => { if (e.target.id === 'unlock') { S.unlock = e.target.checked; save(); renderSide(); } });
$('menu').addEventListener('click', () => openSide(!$('side').classList.contains('open')));
$('scrim').addEventListener('click', () => openSide(false));
document.addEventListener('keydown', e => { if (e.key === 'Escape') openSide(false); });

(function init(){
  const h = (location.hash || '').slice(1);
  const m = h.match(/^l(\d+-\d+)$/);
  if (h === 'fiches') view = { type:'fiches' };
  else if (m && LES[m[1]] && available(m[1])) view = { type:'lesson', id:m[1] };
  renderAll();
})();
</script>
